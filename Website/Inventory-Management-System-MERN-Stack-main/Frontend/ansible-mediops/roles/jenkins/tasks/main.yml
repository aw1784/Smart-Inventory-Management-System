---
- name: Install OpenJDK 17 Runtime Environment
  apt:
    name: openjdk-17-jre
    state: present
    update_cache: yes

- name: Download Jenkins archive repository GPG key
  get_url:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
    dest: /usr/share/keyrings/jenkins-keyring.asc
    mode: '0644'

- name: Add Jenkins stable APT repository configuration
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
    state: present
    filename: jenkins

- name: Install Jenkins continuous integration package
  apt:
    name: jenkins
    state: present
    update_cache: yes

- name: Verify Jenkins service configuration state
  systemd:
    name: jenkins
    state: started
    enabled: yes